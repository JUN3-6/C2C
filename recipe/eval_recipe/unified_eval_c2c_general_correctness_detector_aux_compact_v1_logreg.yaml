model:
  model_name: Rosetta
  rosetta_config:
    base_model: Qwen/Qwen3-0.6B
    teacher_model: Qwen/Qwen2.5-0.5B-Instruct
    is_do_alignment: false
    alignment_strategy: "longest"
    checkpoints_dir: local/checkpoints/0.6+0.5B_C2C_general_again/final
    include_response: false
    static_gate_enabled: false
    entropy_gate_enabled: false
    multi_source_fusion_mode: sequential
    update_decode_past: false

  generation_config:
    do_sample: false
    max_new_tokens: 64

output:
  output_dir: local/final_results/c2c_general_correctness_detector_aux_compact_v1_logreg

eval:
  dataset: mmlu-redux
  gpu_ids: [0]
  answer_method: fusion_receiver_correctness_detector
  correctness_detector_config: local/final_results/mmlu_aux15k_correctness_detector_compact_v1_logreg/fusion_receiver_correctness_detector_logreg_20260505_024419_config.json
  use_cot: false
  use_template: true
  sample_interval: 1
  math_grading_method: "comprehensive"
