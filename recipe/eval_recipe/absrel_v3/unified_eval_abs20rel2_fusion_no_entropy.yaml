model:
  model_name: Rosetta
  rosetta_config:
    base_model: Qwen/Qwen3-0.6B
    teacher_model: Qwen/Qwen2.5-0.5B-Instruct
    is_do_alignment: false
    alignment_strategy: "longest"
    checkpoints_dir: local/checkpoints/0.6+0.5B_C2C_general_again/final
    include_response: false
    static_gate_enabled: true
    entropy_gate_enabled: false
    threshold_abs: 0.20
    threshold_rel: 0.02

  generation_config:
    do_sample: false
    max_new_tokens: 64

output:
  output_dir: local/final_results/abs20rel2_fusion_no_entropy_generate_no_response

eval:
  dataset: mmlu-redux
  gpu_ids: [0]
  answer_method: generate
  use_cot: false
  use_template: true
  sample_interval: 1
  math_grading_method: "comprehensive"
