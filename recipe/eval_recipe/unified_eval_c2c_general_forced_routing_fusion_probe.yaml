model:
  model_name: Rosetta
  rosetta_config:
    base_model: Qwen/Qwen3-0.6B
    teacher_model: Qwen/Qwen2.5-0.5B-Instruct
    is_do_alignment: false
    alignment_strategy: "longest"
    checkpoints_dir: local/checkpoints/0.6+0.5B_C2C_general_again/final
    include_response: false
    static_gate_enabled: false
    entropy_gate_enabled: false
    multi_source_fusion_mode: sequential
    routing:
      projector_bank_dirs:
        - local/checkpoints/0.6+0.5B_C2C_general_again/final
      router_dir: local/router_runs/debug_force_fuse_general_router
      fuse_threshold: 0.5

  generation_config:
    do_sample: false
    max_new_tokens: 64

output:
  output_dir: local/final_results/c2c_general_forced_routing_fusion_probe

eval:
  dataset: mmlu-redux
  gpu_ids: [0]
  answer_method: generate
  use_cot: false
  use_template: true
  sample_interval: 1
  limit: 20
  subjects:
    - abstract_algebra
    - anatomy
    - high_school_psychology
    - machine_learning
  math_grading_method: "comprehensive"
